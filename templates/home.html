{% extends "base.html" %}
 {% block content %}
  
    <h1>Booking</h1>
    <h4>Available Apartments</h4>
    {% for apartment in  apartments%}

        <div class="card" style="width: 18rem;">
        <img src="{{apartment.image.url}}" class="card-img-top" alt="...">
        <div class="card-body">
            <h5 class="card-title">{{apartment.name}}</h5>
            <p class="card-text">{{apartment.price}}</p>
            <a href="{% url "apartment_page" apartment.id %}" class="btn btn-primary">Book now</a>
        </div>
        </div>
    
    {% endfor %}
 
 {% endblock  %}

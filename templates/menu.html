{% load static %}

<nav class="navbar navbar-expand-lg site-navbar">
    <div class="container-fluid navbar-container">

        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'img/hotel.png' %}" alt="BlueStay logo">
            <span>BLUE<span class="brand-accent">STAY</span></span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Відкрити меню"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav main-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}#apartments">
                        Apartments
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}#hotels">
                        Hotels
                    </a>
                </li>
            </ul>

            <div class="navbar-auth">
                {% if user.is_authenticated %}

                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-auth-button logout-button">
                            Logout
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'login' %}" class="nav-auth-button login-button">
                        Login
                    </a>

                    <a href="{% url 'register' %}" class="nav-auth-button register-button">
                        Register
                    </a>

                {% endif %}
            </div>

        </div>
    </div>
</nav>
